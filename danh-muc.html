<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Danh mục sản phẩm BVTV | Agrotech</title><style>body{margin:0;background:#f3f7f1;color:#172018;font:15px Arial}header{background:#0d4b29;color:#fff;padding:26px 6%}h1{margin:0}.wrap{max-width:1200px;margin:20px auto;padding:0 16px}.note,.card{background:#fff;border:1px solid #d8e6d4;border-radius:14px;padding:18px;margin:14px 0}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.filters input{padding:13px;border:1px solid #b9ceb5;border-radius:9px;font-size:15px}.stats{color:#55705a;margin:12px 0}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.item{background:#fff;border:1px solid #d8e6d4;border-radius:12px;padding:15px;cursor:pointer}.item:hover{border-color:#168044;box-shadow:0 3px 12px #17451a18}.item h3{margin:0 0 8px;color:#14532d}.line{margin:5px 0}.label{color:#657565;font-size:12px;font-weight:bold}.button{display:inline-block;background:#14532d;color:#fff;padding:8px 11px;border-radius:7px;margin-top:8px}@media(max-width:700px){.filters,.list{grid-template-columns:1fr}}</style></head><body><header><h1>Agrotech BVTV — Danh mục sản phẩm</h1><p>Tra cứu theo tên công ty, tên sản phẩm hoặc tên hoạt chất</p></header><main class="wrap"><div class="note"><b>Lưu ý:</b> Thông tin trên trang chỉ mang tính tham khảo, tổng hợp từ Danh mục thuốc BVTV và dữ liệu mở. Mỗi sản phẩm có thể bấm để mở hồ sơ chi tiết.</div><section class="card"><div class="filters"><input id="company" placeholder="Tên công ty..." oninput="render()"><input id="name" placeholder="Tên sản phẩm..." oninput="render()"><input id="active" placeholder="Tên hoạt chất..." oninput="render()"></div><div class="stats" id="stats">Đang tải danh mục...</div><div class="list" id="list"></div></section></main><script>let all=[],shown=[];const $=x=>document.getElementById(x);function esc(x){return x.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function render(){let c=$('company').value.toLowerCase(),n=$('name').value.toLowerCase(),a=$('active').value.toLowerCase();shown=all.filter(x=>(!c||x.company.toLowerCase().includes(c))&&(!n||x.name.toLowerCase().includes(n))&&(!a||x.active.toLowerCase().includes(a))).slice(0,200);$('stats').textContent='Hiển thị '+shown.length+' / '+all.length+' sản phẩm'+(all.length>200?' (tối đa 200 kết quả đầu)':'');$('list').innerHTML=shown.map(x=>'<article class="item" onclick="openProduct('+JSON.stringify(x.name)+')"><h3>'+esc(x.name)+'</h3><div class="line"><span class="label">HOẠT CHẤT</span><br>'+esc(x.active||'Chưa cập nhật')+'</div><div class="line"><span class="label">CÔNG TY</span><br>'+esc(x.company||'Chưa cập nhật')+'</div><span class="button">Mở hồ sơ chi tiết →</span></article>').join('')||'<p>Không tìm thấy sản phẩm phù hợp.</p>'}function openProduct(n){location.href='tra-cuu.html?product='+encodeURIComponent(n)+'&v=catalog'}fetch('data/catalog.json').then(r=>r.json()).then(x=>{all=x;render()}).catch(()=>{$('stats').textContent='Không tải được danh mục; vui lòng tải lại trang.'});</script></body></html>
